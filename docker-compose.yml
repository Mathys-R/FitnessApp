services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: fitness-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Montages pour hot-reload du code source
      - .:/app
      # Volumes nommés isolant strictement les paquets et le cache Next.js du Mac hôte
      - fitness_node_modules:/app/node_modules
      - fitness_next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    env_file:
      - .env.local
    command: npm run dev -- -H 0.0.0.0

  mock-supabase:
    image: node:20-alpine
    container_name: fitness-mock-supabase
    restart: unless-stopped
    ports:
      - "8000:8000"
    working_dir: /server
    volumes:
      - ./docker/mock-server:/server:ro
    command: node server.mjs

volumes:
  fitness_node_modules:
    name: fitness_node_modules
  fitness_next_cache:
    name: fitness_next_cache
